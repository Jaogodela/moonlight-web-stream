<!DOCTYPE html>
<html lang="en" class="notranslate">

<head>
    <meta charset="UTF-8" />
    <link rel="preload" href="<%= require('./resources/fonts/Geist-Variable.woff2') %>" as="font" type="font/woff2" crossorigin>
<script>
  (function () {
    try {
      var p = localStorage.getItem("gaspar.theme") || "system";
      var dark = p === "dark" || (p === "system" && !window.matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.themePref = p;
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  })();
</script>

<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="google" content="notranslate" />
    <title>Admin — Gaspar</title>
    <link rel="icon" href="resources/gaspar.svg" sizes="any" type="image/svg+xml">

    <script src="./config.js"></script>

    <script>
        try {
            const raw = localStorage.getItem("mlSettings");
            const parsed = raw ? JSON.parse(raw) : null;
            const value = parsed && parsed.language;
            const aliases = { zh: "zh-CN", "zh-CN": "zh-CN", zh_CN: "zh-CN", pt: "pt-BR", "pt-BR": "pt-BR", pt_BR: "pt-BR", fr: "fr-FR", "fr-FR": "fr-FR", fr_FR: "fr-FR", ko: "ko-KR", "ko-KR": "ko-KR", ko_KR: "ko-KR" };
            const language = Object.prototype.hasOwnProperty.call(aliases, value) ? aliases[value] : "en";
            document.documentElement.lang = language;
            document.documentElement.translate = false;
            document.documentElement.classList.add("notranslate");
        } catch (_err) { }
    </script>
</head>

<body>
    <a class="gs-skiplink" href="#main-content">Pular para o conteúdo</a>
    <!-- Modal -->
    <div id="modal-overlay" class="modal-background modal-disabled">
        <!-- Modal Content -->
        <div id="modal-parent" class="modal-content gs-dialog" role="dialog" aria-modal="true" tabindex="-1">
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu-background context-menu-disabled">
    </div>

    <!-- Errors -->
    <div id="notification-list">
    </div>

    <!-- Main App View -->
    <div id="root">
    </div>

</body>

</html>
