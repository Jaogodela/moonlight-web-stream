<!DOCTYPE html>
<html lang="en" class="stream notranslate">

<head>
    <meta charset="UTF-8" />
    <link rel="preload" href="<%= require('./resources/fonts/Geist-Variable.woff2') %>" as="font" type="font/woff2" crossorigin>
<script>
  (function () {
    try {
      var p = localStorage.getItem("gaspar.theme") || "system";
      var dark = p === "dark" || (p === "system" && !window.matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.dataset.themePref = p;
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  })();
</script>

<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="google" content="notranslate" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widgets=overlays-content" />
    <title>Stream</title>
    <link rel="icon" href="resources/moonlight.svg" sizes="any" type="image/svg+xml">

    <script src="./config.js"></script>

    <script>
        try {
            const raw = localStorage.getItem("mlSettings");
            const parsed = raw ? JSON.parse(raw) : null;
            const language = parsed && (parsed.language === "zh-CN" || parsed.language === "zh" || parsed.language === "zh_CN")
                ? "zh-CN"
                : "en";
            document.documentElement.lang = language;
            document.documentElement.translate = false;
            document.documentElement.classList.add("notranslate");
        } catch (_err) { }
    </script>
</head>

<body class="stream">
    <!-- Modal -->
    <div id="modal-overlay" class="modal-background modal-disabled">
        <!-- Modal Content -->
        <div id="modal-parent" class="modal-content gs-dialog" role="dialog" aria-modal="true" tabindex="-1">
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar-overlay prevent-start-transition" id="sidebar-root">
        <div class="sidebar-background prevent-start-transition">
            <button id="sidebar-button" class="sidebar-button">
                <div class="sidebar-button-image prevent-start-transition"></div>
            </button>
            <div id="sidebar-parent" class="sidebar-content">
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification-list">
    </div>

    <!-- A dummy element for capturing inputs -->
    <div id="input" tabindex="0"></div>

    <!-- Main App View -->
    <div id="root">
    </div>

</body>

</html>
