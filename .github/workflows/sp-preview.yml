name: SP Preview (linux web build)

# Minimal additive workflow to produce a downloadable linux web-server +
# static UI for a private local preview. It does not replace upstream CI,
# SP-CI, or SP-Release, and it does not publish images or GitHub Releases.

on:
  workflow_dispatch:
  push:
    branches:
      - sp/preview-build

permissions:
  contents: read

concurrency:
  group: sp-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install wasm-bindgen-cli
        run: cargo binstall --no-confirm --force wasm-bindgen-cli@0.2.128

      - name: Build server and web UI
        run: |
          cargo build --release
          npm ci
          npm run build
          mv dist static
          rm -rf web-server
          mv target/release/web-server web-server

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: moonlight-web-x86_64-unknown-linux-gnu
          path: |
            web-server
            static
          if-no-files-found: error
          retention-days: 7
