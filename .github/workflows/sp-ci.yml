name: SP CI (bridge image)

# Additive workflow for the Gaspar fork. It does not modify or replace the
# upstream ci.yml / prepare-release.yml and only runs on the SP branches.
#
# NOTE: A green run proves that the image compiles and packages correctly on a
# CPU-only ubuntu-latest runner. It does NOT repeat the T-010 runtime proof of
# concept (pairing with Sunshine and streaming SuperTuxKart in a browser),
# which requires a GPU/WSL host and is still pending.

on:
  push:
    branches:
      - sp/main
      - 'sp/**'
  pull_request:
    branches:
      - sp/main
      - 'sp/**'

permissions:
  contents: read

concurrency:
  group: sp-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jaogodela/sp-bridge

jobs:
  image:
    name: Build bridge image (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Resolve build metadata
        id: meta
        run: |
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/sp.dockerfile
          platforms: linux/amd64
          push: false
          load: false
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
            VERSION=ci
            REVISION=${{ steps.meta.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # Code checks intentionally stay in upstream ci.yml: it already triggers on
  # every branch and pull request (`branches: '**'` / all PRs), including
  # sp/**. Keeping SP-CI image-only avoids duplicating the multi-target matrix
  # while guaranteeing this workflow has least privilege (no contents: write).
