name: SP Release (bridge image)

# Additive release workflow for the Gaspar fork. It does not run or replace the
# upstream prepare-release.yml (which publishes upstream release artifacts).
#
# Tags: v*-sp.*  e.g. v3.0.2-sp.0
#
# First-time GHCR setup (one-off, after the first successful push):
#   1. The package is created private by default. Open
#      https://github.com/users/Jaogodela/packages/container/sp-bridge/settings
#      and set visibility as desired (public for a pullable public image).
#   2. Link the package to this repository ("Manage package" -> Connect
#      repository) so repo permissions and GITHUB_TOKEN pushes keep working.
#   3. Confirm Actions has "Read and write permissions" or, preferably, that
#      the workflow-level `packages: write` below is sufficient (it is for
#      GITHUB_TOKEN).

on:
  push:
    tags:
      - 'v*-sp.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version / tag, e.g. v3.0.2-sp.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: sp-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jaogodela/sp-bridge
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build, sign and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version and build metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          case "$VERSION" in
            v*-sp.*) ;;
            *)
              echo "::error::version must match v<semver>-sp.<n>, got '$VERSION'"
              exit 1
              ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/sp.dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image digest (keyless OIDC)
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sp-bridge-${{ steps.meta.outputs.version }}.spdx.json
          artifact-name: sp-bridge-${{ steps.meta.outputs.version }}.spdx.json
          upload-artifact: false

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          target_commitish: ${{ steps.meta.outputs.revision }}
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          body: |
            Gaspar bridge image: `${{ env.IMAGE }}:${{ steps.meta.outputs.version }}`

            - Digest: `${{ steps.build.outputs.digest }}`
            - Revision: `${{ steps.meta.outputs.revision }}`
            - Signed with cosign keyless OIDC (verify with
              `cosign verify ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}`).
            - SBOM attached as `sp-bridge-${{ steps.meta.outputs.version }}.spdx.json`.
          files: sp-bridge-${{ steps.meta.outputs.version }}.spdx.json
